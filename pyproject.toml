[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustedge"
version = "0.1.0"
description = "TrustEdge - AWS inbound trust boundary analyzer. Grades who outside an account can become an identity inside it, and what they gain."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Het Patel" }]
keywords = [
  "aws",
  "iam",
  "security",
  "trust-policy",
  "sts",
  "assumerole",
  "oidc",
  "cloud-security",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

# TrustEdge deliberately has ZERO runtime dependencies.
# It parses JSON with the standard library and must run in an air-gapped
# environment against an offline IAM export.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
trustedge = "trustedge.cli:main"

[project.urls]
Homepage = "https://github.com/hetpatel/trustedge"
Documentation = "https://github.com/hetpatel/trustedge/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustedge = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Byte-compile every module
        # Catches a syntax error on a Python version the tests happen not to
        # import, which is cheaper than finding it in a release.
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest -q

      - name: Confirm the analyser has no runtime dependencies
        # The whole point of a zero-dependency tool is that it stays that way.
        # `pip check` on a fresh install of the package alone would pass with
        # dependencies present, so assert the metadata directly.
        run: |
          python - <<'PY'
          import importlib.metadata as md
          requires = md.requires("trustedge") or []
          runtime = [r for r in requires if "extra ==" not in r]
          assert not runtime, "trustedge gained runtime dependencies: %r" % runtime
          print("no runtime dependencies")
          PY

  end-to-end:
    name: end-to-end CLI behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Version and help
        run: |
          trustedge --version
          trustedge --help > /dev/null
          trustedge analyze --help > /dev/null

      - name: Validate every fixture parses as expected
        run: |
          trustedge validate --input fixtures/sample-account.json
          trustedge validate --input fixtures/minimal-export.json
          # The malformed fixture must exit 2 - it exists to prove that
          # unreadable input is reported rather than silently dropped.
          set +e
          trustedge validate --input fixtures/malformed-export.json
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: Produce all three report formats
        run: |
          mkdir -p reports
          trustedge analyze -i fixtures/sample-account.json -o reports/report.json -f json
          trustedge analyze -i fixtures/sample-account.json -o reports/report.md   -f markdown
          trustedge analyze -i fixtures/sample-account.json -o reports/report.html -f html
          python -c "import json,sys; d=json.load(open('reports/report.json')); \
                     assert d['schema']=='trustedge.report/1'; \
                     assert d['summary']['findings_total']>0; \
                     print('findings:', d['summary']['severity_counts'])"
          grep -q '^# TrustEdge inbound trust boundary report' reports/report.md
          grep -q '^<!DOCTYPE html>' reports/report.html

      - name: Report must be reproducible
        run: |
          trustedge analyze -i fixtures/sample-account.json -f json | \
            python -c "import json,sys; print(json.dumps([f['finding_id'] for f in json.load(sys.stdin)['findings']]))" > a.txt
          trustedge analyze -i fixtures/sample-account.json -f json | \
            python -c "import json,sys; print(json.dumps([f['finding_id'] for f in json.load(sys.stdin)['findings']]))" > b.txt
          diff a.txt b.txt

      - name: Exit code 0 when nothing reaches the threshold
        run: trustedge analyze -i fixtures/minimal-export.json --fail-on critical --quiet

      - name: Exit code 1 when a finding reaches the threshold
        run: |
          set +e
          trustedge analyze -i fixtures/sample-account.json --fail-on critical --quiet > /dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: Exit code 2 for a missing input file
        run: |
          set +e
          trustedge analyze -i does-not-exist.json > /dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: Exit code 2 for input that is not an IAM export
        run: |
          echo '[]' > not-an-export.json
          set +e
          trustedge analyze -i not-an-export.json > /dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: Convert authorization-details output and analyse the result
        run: |
          trustedge convert -i fixtures/authorization-details-sample.json \
                            --add fixtures/context-supplement.json \
                            -o converted.json
          trustedge analyze -i converted.json -f json | \
            python -c "import json,sys; d=json.load(sys.stdin); \
                       assert d['summary']['roles_analyzed']>=1; print('ok')"

      - name: The local viewer starts and answers
        run: |
          trustedge serve --port 8765 --quiet &
          server=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/healthz | grep -q '"ok": true'
          curl -sf -X POST --data-binary @fixtures/minimal-export.json \
               -H 'Content-Type: application/json' \
               http://127.0.0.1:8765/api/analyze | grep -q '"ok": true'
          kill "$server"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustedge-reports
          path: reports/
          retention-days: 7

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fixtures must be valid JSON and declare themselves synthetic
        run: |
          python - <<'PY'
          import glob, json, sys
          failures = []
          for path in sorted(glob.glob("fixtures/*.json")):
              with open(path, encoding="utf-8") as handle:
                  try:
                      data = json.load(handle)
                  except ValueError as exc:
                      failures.append("%s: invalid JSON (%s)" % (path, exc))
                      continue
              note = json.dumps(data.get("_note", "")).upper()
              if "SYNTHETIC" not in note:
                  failures.append("%s: no _note declaring the data synthetic" % path)
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("fixtures ok")
          PY

      - name: No secret-shaped strings anywhere in the repository
        run: |
          # AKIA/ASIA access key ids, PEM blocks, secret-key assignments. The
          # fixtures are synthetic, and this is the check that keeps them so.
          fail=0
          if grep -rInE --exclude-dir=.git '(AKIA|ASIA)[0-9A-Z]{16}' . ; then
            echo "found something shaped like an AWS access key id"; fail=1
          fi
          if grep -rIn --exclude-dir=.git 'BEGIN [A-Z ]*PRIVATE KEY' . ; then
            echo "found a private key block"; fail=1
          fi
          if grep -rInE --exclude-dir=.git 'aws_secret_access_key[[:space:]]*[:=]' . ; then
            echo "found an aws_secret_access_key assignment"; fail=1
          fi
          test "$fail" -eq 0 || exit 1
          echo "no secrets found"

      - name: Documentation must not carry unsourced statistics
        run: |
          # Every factual claim in this project is supposed to be traceable to
          # a primary source. A bare percentage in the docs is the smell that
          # someone repeated a number they did not check.
          if grep -rInE '[0-9]+(\.[0-9]+)?%' README.md docs/ ; then
            echo "found a percentage in the documentation - add a source to docs/research.md or remove it"
            exit 1
          fi
          echo "no unsourced statistics"

      - name: Every documentation file referenced by the README exists
        run: |
          python - <<'PY'
          import os, re, sys
          text = open("README.md", encoding="utf-8").read()
          missing = []
          for target in re.findall(r"\]\(([^)#]+\.(?:md|ya?ml|json))", text):
              if target.startswith("http"):
                  continue
              if not os.path.exists(target):
                  missing.append(target)
          if missing:
              print("README links to files that do not exist:", missing)
              sys.exit(1)
          print("all README file links resolve")
          PY

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t trustedge:ci .

      - name: The image runs the analyser as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id trustedge:ci -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          echo "running as uid $uid"

      - name: Analyse a fixture through the image, with no network
        run: |
          mkdir -p reports
          docker run --rm --network none \
            -v "$PWD:/work" -w /work trustedge:ci \
            analyze --input fixtures/sample-account.json \
                    --output reports/docker-report.json --format json
          python -c "import json; d=json.load(open('reports/docker-report.json')); \
                     assert d['summary']['findings_total']>0; print('ok')"

      - name: Exit codes survive the container boundary
        run: |
          set +e
          docker run --rm --network none -v "$PWD:/work" -w /work trustedge:ci \
            analyze -i fixtures/sample-account.json --fail-on critical --quiet > /dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
